name: Collect Velo'v network data

on:
  schedule:
    # Offset from the exact quarter-hours (:00/:15/:30/:45), which get
    # congested with GitHub-wide scheduled runs and are frequently
    # delayed or dropped.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # Site code (main): only needed to run scripts/fetch_station.py.
      - name: Checkout site
        uses: actions/checkout@v4

      # Data lives on its own branch that GitHub Pages never watches, so
      # pushing a new snapshot never triggers a Pages rebuild — only
      # pushes to main (actual site changes) do.
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch network snapshot
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data-branch/data
        run: python3 scripts/fetch_stations.py

      - name: Commit and push data
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update network snapshot"
            git pull --rebase origin data
            git push origin HEAD:data
          fi
