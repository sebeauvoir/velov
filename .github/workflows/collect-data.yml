name: Collect Velo'v station data

on:
  schedule:
    # Offset from the exact quarter-hours (:00/:15/:30/:45), which get
    # congested with GitHub-wide scheduled runs and are frequently
    # delayed or dropped.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch station snapshot
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}
        run: python3 scripts/fetch_station.py

      # The site fetches data/history.jsonl straight from
      # raw.githubusercontent.com rather than through the Pages
      # deployment, so this push is all that's needed for the data to
      # go live — no Pages rebuild is triggered or required.
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update station snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
